# Pinned snapshot of the working `hfradarpy` conda env (conda env export --no-builds).
# Rebuild on a server with:
#   conda env create -n hfradarpy -f environment.lock.yml
#   conda activate hfradarpy && pip install -e ..     # hfradarpy itself, from this repo
# Regenerate after a deliberate upgrade:
#   conda env export -n hfradarpy --no-builds | grep -v "^prefix:" > environment.lock.yml
#   (then delete the trailing "pip: hfradarpy==0+unknown" lines again)
