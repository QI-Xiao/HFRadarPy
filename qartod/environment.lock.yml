# Conda env for the daily pipeline, pinned to the versions the QC step was
# tested with.  Only direct dependencies are listed so the file solves on any
# platform (a full `conda env export` from a Mac drags in macOS-only packages
# such as pyobjc and will not solve on Linux).
#
# Rebuild on a server with:
#   conda env create -n hfradarpy -f environment.lock.yml
#   conda activate hfradarpy && pip install -e ..     # hfradarpy itself, from this repo
#
# pandas must stay < 3 until the to_ruv() fix (commit 840c562) is verified under pandas 3.
name: hfradarpy
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  # core
  - numpy=2.3.*
  - pandas=2.3.*
  - xarray=2026.7.*
  - scipy=1.18.*
  - netcdf4=1.7.*
  - bottleneck=1.6.*
  - dask=2026.7.*
  - pyproj=3.7.*
  - shapely=2.1.*
  - geopandas=1.1.*
  - geopy=2.5.*
  - click=8.4.*
  - joblib=1.5.*
  - oceans=1.3.*
  # plotting (imported at module level by hfradarpy)
  - matplotlib=3.10.*
  - cartopy=0.25.*
  - basemap=2.0.*
  - cmocean=4.0.*
  # tests
  - pytest=9.*
